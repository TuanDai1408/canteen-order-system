<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <defs>
    <style>
      .red-fill { fill: #ED1C24; }
      .red-stroke { stroke: #ED1C24; fill: none; }
    </style>
  </defs>

  <!-- ==================== LEFT ICON: BOWL + HEART + HAND ==================== -->
  <g transform="translate(10, 0)">
    <!-- Steam Cloud Outlines -->
    <path d="M 28 62 C 22 48, 30 28, 52 26 C 58 10, 78 8, 94 18 C 98 22, 100 28, 100 36" 
          fill="none" stroke="#ED1C24" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 108 36 C 108 28, 110 22, 114 18 C 130 8, 150 10, 156 26 C 178 28, 186 48, 180 62" 
          fill="none" stroke="#ED1C24" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Solid Red Heart in center steam -->
    <path d="M 104 18 C 104 18, 95 2, 83 8 C 71 14, 75 30, 104 52 C 133 30, 137 14, 125 8 C 113 2, 104 18, 104 18 Z" 
          fill="#ED1C24" />

    <!-- Top Rim separator line -->
    <line x1="20" y1="64" x2="188" y2="64" stroke="#ED1C24" stroke-width="6.5" stroke-linecap="round" />

    <!-- Solid Red Bowl -->
    <path d="M 16 72 L 192 72 C 192 100, 180 120, 160 130 C 138 142, 104 146, 80 142 C 44 134, 22 108, 16 72 Z" 
          fill="#ED1C24" />

    <!-- Caring Gentle Hand holding the bowl -->
    <path d="M 186 112 C 192 118, 190 128, 182 134 C 164 154, 138 168, 100 176 C 68 182, 42 178, 24 196 C 22 182, 28 164, 42 152 C 58 136, 84 130, 110 130 C 136 130, 148 138, 142 146 C 136 152, 120 152, 100 148 C 86 146, 80 150, 86 155 C 98 162, 120 162, 140 151 C 158 140, 174 126, 178 114 C 180 110, 184 108, 186 112 Z" 
          fill="#ED1C24" />
  </g>

  <!-- ==================== RIGHT TEXT: Cơm Ngon SIBA + Ăn sạch Sống khỏe ==================== -->
  <g transform="translate(225, 12)">
    <!-- Main Brand Title: Cơm Ngon SIBA -->
    <text x="0" y="62" 
          font-family="'Be Vietnam Pro', 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif" 
          font-size="46" 
          font-weight="800" 
          fill="#ED1C24" 
          letter-spacing="-0.5">
      Cơm Ngon <tspan font-weight="900" fill="#ED1C24">SIBA</tspan>
    </text>

    <!-- Subtitle: Ăn sạch Sống khỏe -->
    <text x="2" y="112" 
          font-family="'Be Vietnam Pro', 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif" 
          font-size="26" 
          font-weight="700" 
          fill="#ED1C24" 
          letter-spacing="0.5">
      Ăn sạch Sống khỏe
    </text>
  </g>
</svg>
