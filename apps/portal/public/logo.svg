<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <style>
      .siba-brand-red { fill: #ED1C24; }
      .siba-brand-red-stroke { stroke: #ED1C24; fill: none; }
      .siba-brand-maroon { fill: #5C1D2E; }
    </style>
  </defs>

  <!-- ==================== LEFT ICON: EXACT MATCH ==================== -->
  <g transform="translate(10, 5)">
    <!-- Base line of steam / top rim -->
    <path d="M 28 85 L 182 85" stroke="#ED1C24" stroke-width="6.5" stroke-linecap="round" />

    <!-- Steam Cloud Outline (Left to Right) -->
    <path d="M 33 83 C 28 72, 35 55, 52 54 C 56 40, 74 38, 90 47 C 93 51, 95 56, 95 63" 
          fill="none" stroke="#ED1C24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 115 63 C 115 56, 117 51, 120 47 C 136 38, 154 40, 158 54 C 175 55, 182 72, 177 83" 
          fill="none" stroke="#ED1C24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Solid Heart in center of steam -->
    <path d="M 105 48 C 105 48, 97 34, 87 39 C 77 44, 80 57, 105 76 C 130 57, 133 44, 123 39 C 113 34, 105 48, 105 48 Z" 
          fill="#ED1C24" />

    <!-- Solid Red Bowl -->
    <path d="M 20 92 L 190 92 C 190 118, 180 138, 162 148 C 140 160, 108 164, 84 160 C 50 152, 26 126, 20 92 Z" 
          fill="#ED1C24" />

    <!-- Caring Gentle Hand -->
    <path d="M 185 138 C 190 142, 188 150, 182 155 C 166 172, 142 190, 108 200 C 80 208, 55 204, 38 224 C 36 210, 41 192, 54 180 C 70 164, 94 158, 118 158 C 142 158, 152 166, 148 172 C 144 178, 130 178, 110 175 C 98 173, 92 177, 98 181 C 108 187, 128 187, 146 177 C 162 168, 176 153, 180 141 C 181 138, 184 136, 185 138 Z" 
          fill="#ED1C24" />
  </g>

  <!-- ==================== RIGHT TEXT: CƠM NGON SIBA ==================== -->
  <g transform="translate(225, 0)">
    <!-- Stacked "Cơm" (Top) -->
    <text x="0" y="80" 
          font-family="'Be Vietnam Pro', 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="44" 
          font-weight="800" 
          fill="#5C1D2E" 
          letter-spacing="-0.5">Cơm</text>

    <!-- Stacked "Ngon" (Bottom) -->
    <text x="0" y="126" 
          font-family="'Be Vietnam Pro', 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="44" 
          font-weight="800" 
          fill="#5C1D2E" 
          letter-spacing="-0.5">Ngon</text>

    <!-- Big Bold "SIBA" -->
    <text x="128" y="126" 
          font-family="'Be Vietnam Pro', 'Montserrat', 'Arial Black', sans-serif" 
          font-size="84" 
          font-weight="900" 
          fill="#5C1D2E" 
          letter-spacing="1.5">SIBA</text>

    <!-- Red Banner for Slogan -->
    <rect x="0" y="150" width="305" height="35" rx="9" fill="#ED1C24" />

    <!-- Slogan: ĂN SẠCH – SỐNG KHỎE -->
    <text x="152" y="174" 
          text-anchor="middle"
          font-family="'Be Vietnam Pro', 'Montserrat', 'Arial Black', sans-serif" 
          font-size="16.5" 
          font-weight="900" 
          fill="#FFFFFF" 
          letter-spacing="3.5">ĂN SẠCH – SỐNG KHỎE</text>
  </g>
</svg>
