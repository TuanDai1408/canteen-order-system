<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant Siba Gradients -->
    <linearGradient id="sibaRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <linearGradient id="sibaOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="sibaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#DC2626" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ICON GROUP: Rice Bowl + Heart Steam + Caring Hand -->
  <g transform="translate(15, 10)" filter="url(#softGlow)">
    <!-- Rice Fluff Clouds in Bowl -->
    <path d="M 60 92 C 50 68, 80 50, 100 62 C 115 48, 145 48, 158 65 C 175 52, 205 68, 198 92 Z" 
          fill="#FFF7ED" stroke="url(#sibaRedGrad)" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Center Heart in Steam -->
    <path d="M 130 38 C 130 38, 120 22, 108 28 C 96 34, 100 50, 130 72 C 160 50, 164 34, 152 28 C 140 22, 130 38, 130 38 Z" 
          fill="url(#sibaRedGrad)" />

    <!-- Small Sparkles / Steam accents -->
    <circle cx="92" cy="42" r="3.5" fill="url(#sibaGoldGrad)" />
    <circle cx="168" cy="42" r="3.5" fill="url(#sibaGoldGrad)" />

    <!-- Rice Bowl (Smooth curved bowl) -->
    <path d="M 50 90 Q 130 90 210 90 C 205 145, 55 145, 50 90 Z" 
          fill="url(#sibaRedGrad)" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Bowl Highlight Rim -->
    <path d="M 58 98 Q 130 102 202 98" 
          fill="none" stroke="#FEE2E2" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M 75 116 C 85 130, 110 138, 130 138" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />

    <!-- Caring Gentle Hand Supporting the Bowl -->
    <path d="M 45 135 C 50 165, 80 185, 125 185 C 165 185, 195 165, 212 142 C 218 135, 212 125, 202 130 C 180 148, 155 158, 125 158 C 95 158, 70 148, 55 125 C 48 115, 42 122, 45 135 Z" 
          fill="url(#sibaRedGrad)" />
    
    <!-- Delicate hand wrist curve -->
    <path d="M 45 135 C 32 155, 30 180, 52 190 C 75 200, 110 195, 135 190" 
          fill="none" stroke="url(#sibaRedGrad)" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- TEXT GROUP: Cơm Ngon SIBA & Slogan -->
  <g transform="translate(230, 0)">
    <!-- "Cơm Ngon" Text -->
    <text x="0" y="78" 
          font-family="'Be Vietnam Pro', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="44" 
          font-weight="800" 
          fill="url(#sibaRedGrad)" 
          letter-spacing="-0.5">Cơm Ngon</text>

    <!-- "SIBA" Text (Bold & Prominent) -->
    <text x="235" y="80" 
          font-family="'Be Vietnam Pro', 'Montserrat', 'Arial Black', sans-serif" 
          font-size="62" 
          font-weight="900" 
          fill="url(#sibaRedGrad)" 
          letter-spacing="2">SIBA</text>

    <!-- Slogan Underline Bar / Accent -->
    <rect x="2" y="98" width="345" height="3" rx="1.5" fill="url(#sibaGoldGrad)" opacity="0.8" />

    <!-- Slogan: ĂN SẠCH – SỐNG KHỎE -->
    <text x="4" y="132" 
          font-family="'Be Vietnam Pro', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="19" 
          font-weight="800" 
          fill="#DC2626" 
          letter-spacing="5">ĂN SẠCH – SỐNG KHỎE</text>

    <!-- Small Badge: Căn Tin / Suất Ăn Học Đường & Công Sở -->
    <text x="4" y="158" 
          font-family="'Be Vietnam Pro', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="12" 
          font-weight="600" 
          fill="#78716C" 
          letter-spacing="1">HỆ THỐNG SUẤT ĂN DINH DƯỠNG TIÊU CHUẨN</text>
  </g>
</svg>
